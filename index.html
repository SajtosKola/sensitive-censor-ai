<title>Kitakaró Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: egyképernyős chat – fejléc, görgethető üzenetfolyam, alul rögzített beviteli sáv */
:root{
  --bg:#f3f2f7; --panel:#ffffff; --fg:#1b1a24; --muted:#6b6880; --line:#dcdae6;
  --accent:#c2185b; --accent-fg:#ffffff; --bubble-me:#1b1a24; --bubble-me-fg:#f3f2f7;
  --ok:#1f7a4d; --err:#b3261e;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121119; --panel:#1c1b26; --fg:#ecebf3; --muted:#9a97ad; --line:#2e2c3c;
  --accent:#ff4f8b; --accent-fg:#16030a; --bubble-me:#ecebf3; --bubble-me-fg:#121119;
  --ok:#4fd08f; --err:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121119; --panel:#1c1b26; --fg:#ecebf3; --muted:#9a97ad; --line:#2e2c3c;
  --accent:#ff4f8b; --accent-fg:#16030a; --bubble-me:#ecebf3; --bubble-me-fg:#121119;
  --ok:#4fd08f; --err:#ff8a80; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .bar{display:inline-block;width:34px;height:12px;background:var(--fg);border-radius:2px}
.logo em{font-style:normal;background:var(--accent);color:var(--accent-fg);padding:0 6px;border-radius:3px}
.status{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
button{font:inherit;cursor:pointer}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px}
.iconbtn:hover{border-color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#settings{border-bottom:1px solid var(--line);padding-block:12px;display:grid;gap:8px}
#settings label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#settings input{width:100%;font-family:var(--f-mono);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
#settings p{margin:0;font-size:13px;color:var(--muted)}
#settings code{font-family:var(--f-mono);font-size:12px}
main{flex:1;overflow-y:auto;padding-block:20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:min(560px,88%);min-width:0}
.msg.me{align-self:flex-end;align-items:flex-end}
.who{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.me .bubble{background:var(--bubble-me);color:var(--bubble-me-fg);border-color:transparent}
.bubble p{margin:0}
.bubble p+p{margin-top:6px}
.shot{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel);max-width:100%}
.shot img,.shot canvas{display:block;max-width:100%;height:auto}
.shot figcaption{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{background:var(--accent);color:var(--accent-fg);padding:1px 7px;border-radius:4px;font-size:11px}
.dl{margin-left:auto;font-family:var(--f-body);font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:3px 8px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
.err{color:var(--err)}
.sample{margin-top:8px;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 12px;font-weight:600}
footer{border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.preview{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;min-width:0}
.preview img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.preview span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.composer.drag{border-color:var(--accent)}
.attach{border:0;background:transparent;color:var(--fg);width:40px;height:40px;border-radius:10px;font-size:20px;flex:none}
.attach:hover{background:var(--bg)}
#text{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;padding:9px 4px;max-height:120px}
#text:focus{outline:none}
.send{flex:none;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;border-radius:10px;height:40px;padding:0 16px}
.send:disabled{opacity:.45;cursor:not-allowed}
</style>

<div class="app">
  <header>
    <div class="logo"><span class="bar" aria-hidden="true"></span>Kitakaró<em>AI</em></div>
    <div class="status"><span class="dot" id="dot"></span><span id="mode">demó mód</span></div>
    <button class="iconbtn" id="themeBtn" aria-label="Téma váltása">☀ Világos</button>
    <button class="iconbtn" id="setBtn" aria-expanded="false">Beállítások</button>
  </header>

  <section id="settings" hidden>
    <label for="api">Modell API címe</label>
    <input id="api" placeholder="pl. http://localhost:5000/censor  (üresen: demó mód)">
    <p>A weboldal <code>POST</code> kérésben küldi: <code>image</code>, <code>target</code>, <code>style</code>. Válasz lehet egy kész kép, vagy JSON: <code>{"boxes":[{"x":..,"y":..,"w":..,"h":..,"label":".."}]}</code> pixelben vagy 0–1 arányban.</p>
  </section>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div class="chips" id="targets">
      <span class="lbl">Mit takarjon?</span>
      <button class="chip" data-v="arc" aria-pressed="true">Arcok</button>
      <button class="chip" data-v="rendszám" aria-pressed="false">Rendszám</button>
      <button class="chip" data-v="szöveg" aria-pressed="false">Szöveg</button>
      <button class="chip" data-v="test" aria-pressed="false">Testrészek</button>
    </div>
    <div class="chips" id="styles">
      <span class="lbl">Stílus</span>
      <button class="chip" data-v="pixel" aria-pressed="true">Pixeles</button>
      <button class="chip" data-v="blur" aria-pressed="false">Elmosás</button>
      <button class="chip" data-v="bar" aria-pressed="false">Fekete sáv</button>
    </div>
    <div class="preview" id="preview" hidden><img id="pimg" alt=""><span id="pname"></span><button class="iconbtn" id="premove">Mégse</button></div>
    <div class="composer" id="composer">
      <button class="attach" id="attach" aria-label="Kép feltöltése">＋</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="text" rows="1" placeholder="Tölts fel egy képet, és írd le, mit takarjak ki…"></textarea>
      <button class="send" id="send" disabled>Küldés</button>
    </div>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
const log=$('#log'), fileIn=$('#file'), text=$('#text'), send=$('#send');
let pending=null; // {blob,url,name}
const state={target:'arc',style:'pixel'};

/* ---------- téma (világos / sötét) ---------- */
const root=document.documentElement, themeBtn=$('#themeBtn');
const sysDark=()=>window.matchMedia('(prefers-color-scheme: dark)').matches;
function curTheme(){return root.dataset.theme||(sysDark()?'dark':'light')}
function paintThemeBtn(){themeBtn.textContent=curTheme()==='dark'?'☀ Világos':'☾ Sötét'}
try{const t=localStorage.getItem('censorTheme');if(t)root.dataset.theme=t}catch(e){}
paintThemeBtn();
themeBtn.onclick=()=>{const t=curTheme()==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('censorTheme',t)}catch(e){}paintThemeBtn()};

/* ---------- beállítások ---------- */
let API='';
try{API=localStorage.getItem('censorApi')||''}catch(e){}
$('#api').value=API;
function refreshMode(){$('#mode').textContent=API?'modell csatlakoztatva':'demó mód';$('#dot').classList.toggle('live',!!API)}
refreshMode();
$('#setBtn').onclick=()=>{const s=$('#settings');s.hidden=!s.hidden;$('#setBtn').setAttribute('aria-expanded',!s.hidden)};
$('#api').oninput=e=>{API=e.target.value.trim();try{localStorage.setItem('censorApi',API)}catch(_){}refreshMode()};

/* ---------- chipek ---------- */
function chipGroup(id,key){document.querySelectorAll(id+' .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll(id+' .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');state[key]=b.dataset.v;})}
chipGroup('#targets','target');chipGroup('#styles','style');

/* ---------- üzenetek ---------- */
function addMsg(who,html,node){
  const m=document.createElement('div');m.className='msg'+(who==='me'?' me':'');
  m.innerHTML=`<div class="who">${who==='me'?'Te':'Kitakaró'}</div>`;
  if(html){const b=document.createElement('div');b.className='bubble';b.innerHTML=html;m.appendChild(b)}
  if(node)m.appendChild(node);
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- feltöltés ---------- */
function setPending(blob,name){
  if(pending)URL.revokeObjectURL(pending.url);
  pending={blob,name,url:URL.createObjectURL(blob)};
  $('#pimg').src=pending.url;$('#pname').textContent=name;$('#preview').hidden=false;send.disabled=false;
}
$('#attach').onclick=()=>fileIn.click();
fileIn.onchange=()=>{const f=fileIn.files[0];if(f)setPending(f,f.name);fileIn.value=''};
$('#premove').onclick=()=>{pending=null;$('#preview').hidden=true;send.disabled=true};
const comp=$('#composer');
['dragover','dragenter'].forEach(e=>comp.addEventListener(e,ev=>{ev.preventDefault();comp.classList.add('drag')}));
['dragleave','drop'].forEach(e=>comp.addEventListener(e,()=>comp.classList.remove('drag')));
comp.addEventListener('drop',ev=>{ev.preventDefault();const f=[...ev.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(f)setPending(f,f.name)});
document.addEventListener('paste',ev=>{const it=[...(ev.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)setPending(it.getAsFile(),'beillesztett kép')});
text.addEventListener('input',()=>{text.style.height='auto';text.style.height=text.scrollHeight+'px'});
text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)go()}});
send.onclick=go;

/* ---------- kép betöltése ---------- */
const loadImg=url=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});

/* ---------- kitakarás a böngészőben a kapott dobozok alapján ---------- */
function censor(img,boxes,style){
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  for(const b0 of boxes){
    let b={...b0};
    if(b.w<=1&&b.h<=1){b.x*=c.width;b.y*=c.height;b.w*=c.width;b.h*=c.height} // arányos koordináták
    b.x=Math.max(0,b.x);b.y=Math.max(0,b.y);b.w=Math.min(c.width-b.x,b.w);b.h=Math.min(c.height-b.y,b.h);
    if(b.w<1||b.h<1)continue;
    if(style==='bar'){x.fillStyle='#000';x.fillRect(b.x,b.y,b.w,b.h)}
    else if(style==='blur'){
      x.save();x.beginPath();x.rect(b.x,b.y,b.w,b.h);x.clip();
      x.filter=`blur(${Math.max(8,Math.round(Math.min(b.w,b.h)/6))}px)`;x.drawImage(img,0,0);x.restore();x.filter='none';
    }else{
      const n=Math.max(6,Math.round(Math.min(b.w,b.h)/10)); // blokkméret
      const t=document.createElement('canvas');t.width=Math.ceil(b.w/n);t.height=Math.ceil(b.h/n);
      t.getContext('2d').drawImage(c,b.x,b.y,b.w,b.h,0,0,t.width,t.height);
      x.imageSmoothingEnabled=false;x.drawImage(t,0,0,t.width,t.height,b.x,b.y,b.w,b.h);x.imageSmoothingEnabled=true;
    }
  }
  return c;
}

/* ---------- modell hívása (vagy demó) ---------- */
async function callModel(blob,target,style,demoBoxes){
  if(!API){
    await new Promise(r=>setTimeout(r,900));
    return {boxes:demoBoxes||[{x:.3,y:.35,w:.4,h:.3,label:'demó'}],demo:true};
  }
  const fd=new FormData();fd.append('image',blob,'kep.png');fd.append('target',target);fd.append('style',style);
  const r=await fetch(API,{method:'POST',body:fd});
  if(!r.ok)throw new Error(`A szerver ${r.status} hibakóddal válaszolt.`);
  const ct=r.headers.get('content-type')||'';
  if(ct.startsWith('image/'))return {image:await r.blob()};
  const j=await r.json();
  if(j.image)return {imageUrl:j.image.startsWith('data:')?j.image:'data:image/png;base64,'+j.image};
  return {boxes:j.boxes||[]};
}

/* ---------- egy kör ---------- */
async function go(demoBoxes){
  if(!pending)return;
  const p=pending, prompt=text.value.trim(), target=prompt||state.target, style=state.style;
  const fig=document.createElement('figure');fig.className='shot';fig.style.margin='0';
  fig.innerHTML=`<img src="${p.url}" alt="Feltöltött kép">`;
  addMsg('me',`<p>${esc(prompt||'Takard ki: '+state.target)}</p>`,fig);
  pending=null;$('#preview').hidden=true;send.disabled=true;text.value='';text.style.height='auto';
  const wait=addMsg('bot','<span class="typing"><span></span><span></span><span></span></span>');
  try{
    const res=await callModel(p.blob,target,style,Array.isArray(demoBoxes)?demoBoxes:null);
    const out=document.createElement('figure');out.className='shot';out.style.margin='0';
    let node, count='';
    if(res.image||res.imageUrl){node=new Image();node.src=res.image?URL.createObjectURL(res.image):res.imageUrl;node.alt='Kitakart kép'}
    else{const img=await loadImg(p.url);node=censor(img,res.boxes,style);count=res.boxes.length}
    out.appendChild(node);
    const cap=document.createElement('figcaption');
    cap.innerHTML=`<span class="tag">${esc(target)}</span><span>${style==='pixel'?'pixeles':style==='blur'?'elmosás':'fekete sáv'}</span>${count!==''?`<span>${count} terület</span>`:''}${res.demo?'<span>demó eredmény</span>':''}`;
    const dl=document.createElement('button');dl.className='dl';dl.textContent='Megnyitás új lapon';
    dl.onclick=()=>{const src=node.tagName==='CANVAS'?node.toDataURL('image/png'):node.src;const a=document.createElement('a');a.href=src;a.target='_blank';a.rel='noopener';a.click()};
    cap.appendChild(dl);out.appendChild(cap);
    wait.remove();
    const msg=res.demo
      ?'<p>Kész. Ez még demó: a modell nincs bekötve, ezért egy minta területet takartam ki.</p>'
      :(count===0?'<p>Nem találtam ilyen részt a képen.</p>':'<p>Kész, kitakartam a kért részt.</p>');
    addMsg('bot',msg,out);
  }catch(e){wait.remove();addMsg('bot',`<p class="err">${esc(e.message||'Nem sikerült elérni a modellt.')} Ellenőrizd az API címét a Beállításokban.</p>`)}
}

/* ---------- mintakép (rajzolt autó rendszámmal) ---------- */
function makeSample(){
  const c=document.createElement('canvas');c.width=800;c.height=500;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,500);g.addColorStop(0,'#9cc6e8');g.addColorStop(.62,'#dbe9f2');g.addColorStop(.62,'#7a7d85');g.addColorStop(1,'#55585f');
  x.fillStyle=g;x.fillRect(0,0,800,500);
  x.fillStyle='#5f7f9e';x.beginPath();x.roundRect(170,150,460,190,40);x.fill();
  x.fillStyle='#4b6782';x.beginPath();x.roundRect(240,95,320,110,36);x.fill();
  x.fillStyle='#bcd7ea';x.fillRect(268,115,264,72);
  x.fillStyle='#e9e3b8';x.fillRect(190,215,70,30);x.fillRect(540,215,70,30);
  x.fillStyle='#1d1f24';[[250,345],[550,345]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,48,0,7);x.fill()});
  x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=3;x.fillRect(330,265,140,40);x.strokeRect(330,265,140,40);
  x.fillStyle='#1d3fa0';x.fillRect(330,265,20,40);
  x.fillStyle='#111';x.font='bold 26px monospace';x.fillText('ABC-123',356,295);
  return new Promise(r=>c.toBlob(r,'image/png'));
}

/* ---------- nyitó üzenet ---------- */
const intro=addMsg('bot','<p>Szia! Tölts fel egy képet (vagy húzd ide, illetve illeszd be), válaszd ki, mit takarjak ki, és küldd el.</p><p>A modell most még nincs bekötve, ezért demó módban futok.</p>');
const sb=document.createElement('button');sb.className='sample';sb.textContent='Kipróbálom egy mintaképpel';
sb.onclick=async()=>{const blob=await makeSample();setPending(blob,'minta_auto.png');
  document.querySelector('#targets [data-v="rendszám"]').click();
  go(API?null:[{x:330,y:265,w:140,h:40,label:'rendszám'}]);};
intro.querySelector('.bubble').appendChild(sb);
</script>
